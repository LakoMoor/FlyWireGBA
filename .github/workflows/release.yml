name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CLANG: /usr/bin/clang
      LD_LLD: /usr/bin/ld.lld
      LLVM_OBJCOPY: /usr/bin/llvm-objcopy
      LLVM_NM: /usr/bin/llvm-nm
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake build-essential pkg-config zlib1g-dev libedit-dev python3-pil
      - name: Build and test
        run: bash tools/ci_check.sh
      - name: Prepare release assets and enforce VERSION/tag agreement
        run: python3 tools/package_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Verify and publish the tested ROM
        working-directory: release-assets
        run: |
          sha256sum --check SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "flywire-gba-${RELEASE_TAG}.gba" \
            "flywire-gba-${RELEASE_TAG}.zip" \
            SHA256SUMS manifest.json \
            --verify-tag --title "FlyWireGBA ${RELEASE_TAG}" \
            --notes-file release-notes.md "${prerelease[@]}"
